[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pyballmapper"]

[tool.setuptools.dynamic]
version = {attr = "pyballmapper.__version__"}

[project]
name = "pyBallMapper"
readme = "README.md"
requires-python = ">=3.13"

maintainers = [
    {name = "Davide Gurnari"},
]

dependencies = [
    "numpy",
    "pandas",
    "networkx",
    "matplotlib",
    "bokeh",
    "numba",
    "scikit-learn"
]

dynamic = ["version"]

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = [".git", "docs/*", "notebooks/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E203", "E501", "E731"]

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
ignore_missing_imports = true

[dependency-groups]
dev = ["pre-commit", "ruff", "mypy", "types-setuptools"]
docs = ["myst-parser", "sphinx-rtd-theme"]
